<div id="withdraw-page" class="hidden">
    <div class="section">
        <h3>Withdraw to Bank (LKR)</h3>
        <p style="font-size: 13px; color: #666;">මොබයිල් රීලෝඩ් හෝ බැංකු ගිණුමට මුදල් ලබාගත හැක.</p>
        
        <select id="pay-method" style="width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 10px;">
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Mobile Reload">Mobile Reload</option>
            <option value="Binance (USDT)">Binance (USDT)</option>
        </select>

        <input type="text" id="acc-name" placeholder="Account Holder Name">
        <input type="text" id="acc-num" placeholder="Account Number / Phone">
        <input type="text" id="bank-name" placeholder="Bank Name & Branch">
        
        <p style="font-size: 12px; color: #e74c3c;">අවම මුදල: 5000 Points (Rs. 500.00)</p>
        
        <button class="btn btn-withdraw" onclick="processWithdraw()">
            <i class="fas fa-university"></i> Submit Request
        </button>
    </div>
</div>

<script>
function processWithdraw() {
    const method = document.getElementById('pay-method').value;
    const name = document.getElementById('acc-name').value;
    const num = document.getElementById('acc-num').value;
    const bank = document.getElementById('bank-name').value;

    if(points < 5000) {
        tg.showAlert("සමාවන්න, මුදල් ලබාගැනීමට අවම වශයෙන් Points 5000ක් තිබිය යුතුය.");
        return;
    }

    if(name && num && bank) {
        tg.showConfirm(`ඔබ මෙම විස්තර තහවුරු කරනවාද?\n\nනම: ${name}\nඅංකය: ${num}\nබැංකුව: ${bank}`, (ok) => {
            if(ok) {
                // මෙතනදී අපි Admin (ඔයාට) මැසේජ් එකක් යවන්න ඕනේ
                // දැනට මේක සරලව ඇලර්ට් එකක් විදිහට පෙන්වයි
                points -= 5000;
                updateUI();
                tg.showAlert("ඔබගේ ඉල්ලීම සාර්ථකව යොමු කරන ලදී! පැය 24ක් ඇතුළත මුදල් බැර කරනු ඇත.");
                
                // ඉස්සරහට මේ විස්තර ටික ඔයාගේ ටෙලිග්‍රෑම් එකට එන විදිහට "Bot API" එකට ලින්ක් කරමු.
            }
        });
    } else {
        tg.showAlert("කරුණාකර සියලුම විස්තර නිවැරදිව ඇතුළත් කරන්න.");
    }
}
</script>
